<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[bf].xyz — Maintenance</title>
  <meta name="description" content="Currently under maintenance." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cyan: #67e8f9;
      --amber: #fcd34d;
      --bg: #05070b;
      --text: #e2e8f0;
      --text-mid: #94a3b8;
      --text-dim: #64748b;
      --line: rgba(148,176,210,0.07);
      --line-mid: rgba(148,176,210,0.14);
      --font: 'Space Grotesk', system-ui, sans-serif;
      --mono: 'JetBrains Mono', 'SF Mono', monospace;
    }

    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    canvas#bgCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .maint-container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 560px;
      padding: 2rem 1.5rem;
    }

    .maint-gear {
      width: 64px;
      height: 64px;
      margin: 0 auto 2rem;
      color: var(--amber);
      animation: spin 8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .maint-badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--amber);
      border: 1px solid color-mix(in srgb, var(--amber) 30%, transparent);
      padding: 0.3em 0.9em;
      border-radius: 999px;
      margin-bottom: 2rem;
    }

    .maint-title {
      font-size: clamp(2rem, 6vw, 2.8rem);
      font-weight: 700;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .maint-title .mono {
      font-family: var(--mono);
      font-size: 0.45em;
      display: block;
      color: var(--text-dim);
      font-weight: 400;
      margin-bottom: 0.4em;
      letter-spacing: 0.08em;
    }

    .maint-desc {
      color: var(--text-mid);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .countdown-box {
      display: inline-flex;
      align-items: baseline;
      gap: 0.5rem;
      background: var(--bg);
      border: 1px solid var(--line-mid);
      border-radius: 12px;
      padding: 0.8rem 1.5rem;
      margin-bottom: 2rem;
    }

    .countdown-label {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    .countdown-value {
      font-family: var(--mono);
      font-size: 1.1rem;
      color: var(--amber);
      font-weight: 600;
    }

    .maint-footer {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text-dim);
      border-top: 1px solid rgba(100, 116, 139, 0.15);
      padding-top: 1.5rem;
    }

    .maint-footer .pulse {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
      margin-right: 0.5em;
      animation: pulse 2s ease-in-out infinite;
      vertical-align: middle;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 color-mix(in srgb, var(--amber) 40%, transparent); }
      50% { opacity: 0.5; box-shadow: 0 0 0 6px transparent; }
    }

    .maint-logo {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 3rem;
    }

    @media (max-width: 520px) {
      .maint-container { padding: 1.5rem 1rem; }
      .maint-gear { width: 48px; height: 48px; margin-bottom: 1.5rem; }
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <div class="maint-container">
    <div class="maint-logo">[bf].xyz</div>

    <svg class="maint-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" />
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" />
    </svg>

    <div class="maint-badge">UNDER MAINTENANCE</div>

    <h1 class="maint-title">
      <span class="mono">// SYSTEM MAINTENANCE</span>
      Back Soon
    </h1>

    <p class="maint-desc" id="maintDesc">
      Hey — we're doing some maintenance on the homelab. Everything will be back up in a few hours.
    </p>

    <div class="countdown-box" id="countdownBox">
      <span class="countdown-label">ESTIMATED RESTORE</span>
      <span class="countdown-value" id="countdownValue">--:--:--</span>
    </div>

    <div class="maint-footer">
      <span class="pulse"></span>
      Maintenance in progress — last updated: <span id="updated"></span>
    </div>
  </div>

  <script>
    (function () {
      document.getElementById('updated').textContent = new Date().toLocaleString();

      // Fetch maintenance state from the worker
      fetch('/api/bf/maintenance/status')
        .then(r => r.json())
        .then(data => {
          if (data.enabled) {
            if (data.message) {
              document.getElementById('maintDesc').textContent = data.message;
            }
            if (data.timeRemaining && data.timeRemaining > 0) {
              startCountdown(data.timeRemaining);
            } else {
              document.getElementById('countdownBox').style.display = 'none';
            }
          }
        })
        .catch(() => {
          // No worker or API unreachable — show default page
        });

      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var c = document.getElementById('bgCanvas');
      var ctx = c.getContext('2d');
      var w, h, particles = [];
      var N = 55;

      function resize() {
        w = c.width = window.innerWidth;
        h = c.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (var i = 0; i < N; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          r: Math.random() * 1.5 + 0.5
        });
      }

      function frame() {
        ctx.clearRect(0, 0, w, h);
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = w;
          if (p.x > w) p.x = 0;
          if (p.y < 0) p.y = h;
          if (p.y > h) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, 6.2832);
          ctx.fillStyle = 'rgba(252,211,77,0.25)';
          ctx.fill();
        }
        for (var i = 0; i < particles.length; i++) {
          for (var j = i + 1; j < particles.length; j++) {
            var dx = particles[i].x - particles[j].x;
            var dy = particles[i].y - particles[j].y;
            var d = dx * dx + dy * dy;
            if (d < 18000) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = 'rgba(252,211,77,' + (0.06 * (1 - d / 18000)) + ')';
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(frame);
      }
      frame();
    })();

    function startCountdown(ms) {
      function tick() {
        var remaining = Math.max(0, ms);
        var hours = Math.floor(remaining / 3600000);
        var mins = Math.floor((remaining % 3600000) / 60000);
        var secs = Math.floor((remaining % 60000) / 1000);
        var el = document.getElementById('countdownValue');
        if (el) {
          el.textContent = [
            String(hours).padStart(2, '0'),
            String(mins).padStart(2, '0'),
            String(secs).padStart(2, '0')
          ].join(':');
        }
        if (remaining <= 0) {
          clearInterval(timer);
          fetch('/api/bf/maintenance/status')
            .then(r => r.json())
            .then(data => {
              if (data.enabled && data.timeRemaining > 0) {
                startCountdown(data.timeRemaining);
              }
            })
            .catch(() => {});
          return;
        }
        ms -= 1000;
      }
      var timer = setInterval(tick, 1000);
      tick();
    }
  </script>
</body>
</html>
