name = "bytefort-metrics"
main = "worker.js"
compatibility_date = "2026-01-01"

# KV namespace binding
kv_namespaces = [
  { binding = "BYTEFORT_UPTIME", id = "f374a1f437ff441885ae7ae781a15a36" }
]

# Routes — already configured in Cloudflare dashboard (Domains & Routes)
# routes = [
#   { pattern = "api.bytefort.xyz/*", custom_domain = true }
# ]

# Cron trigger — accumulates uptime every 5 minutes
[triggers]
crons = [
  "*/5 * * * *"
]
