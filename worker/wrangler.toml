name = "bytefort-metrics"
main = "worker.js"
compatibility_date = "2026-01-01"

# KV namespace binding
kv_namespaces = [
  { binding = "BYTEFORT_UPTIME", id = "f374a1f437ff441885ae7ae781a15a36" }
]

# Preserve the existing custom domain during Wrangler deployments.
routes = [
  { pattern = "api.bytefort.xyz", zone_name = "bytefort.xyz", custom_domain = true, enabled = true, previews_enabled = false }
]

# Check every 5 minutes; persist only initialization and status changes.
[triggers]
crons = [
  "*/5 * * * *"
]
